# DeepSeek model catalog

[provider]
id = "deepseek"

[api_surfaces.platform]
base_url = "https://api.deepseek.com"
auth_methods = ["api_key"]

[default_targets.platform]
protocol = "chat_completions"

# ---- V4 ----

[models."deepseek-v4-pro"]
name = "DeepSeek V4 Pro"
reasoning = true
input = ["text"]
context_window = 1000000
max_tokens = 384000

[models."deepseek-v4-pro".thinking_level_map]
high = "high"
xhigh = "max"
minimal = ""
low = ""
medium = ""

[[models."deepseek-v4-pro".pricing]]
surface = "platform"
basis = "list_price"
currency = "CNY"
input_per_million = 3.0
cached_input_per_million = 0.025
output_per_million = 6.0

[models."deepseek-v4-flash"]
name = "DeepSeek V4 Flash"
reasoning = true
input = ["text"]
context_window = 1000000
max_tokens = 384000

[models."deepseek-v4-flash".targets.platform]
protocol = "responses"
continuation = "stateless_replay"

[models."deepseek-v4-flash".thinking_level_map]
high = "high"
xhigh = "max"
minimal = ""
low = ""
medium = ""

[[models."deepseek-v4-flash".pricing]]
surface = "platform"
basis = "list_price"
currency = "CNY"
input_per_million = 1.0
cached_input_per_million = 0.02
output_per_million = 2.0

# ---- V3 (non-reasoning) ----

[models."deepseek-chat"]
name = "DeepSeek V3"
reasoning = false
input = ["text"]
context_window = 128000
max_tokens = 8192

# ---- R1 (reasoning) ----

[models."deepseek-reasoner"]
name = "DeepSeek R1"
reasoning = true
input = ["text"]
context_window = 128000
max_tokens = 8192
