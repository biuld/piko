# DeepSeek model catalog

[provider]
id = "deepseek"

[upstream_tools.search]
name = "web_search"
approval = "never"
definition = { type = "web_search" }
choice = { type = "web_search" }
activity_types = ["web_search_call"]

[api_surfaces.platform]
base_url = "https://api.deepseek.com"
auth_methods = ["api_key"]
upstream_tools = ["search"]

[default_targets.platform]
protocol = "chat_completions"

# ---- V4 ----

[models."deepseek-v4-pro"]
name = "DeepSeek V4 Pro"
reasoning = true
input = ["text"]
context_window = 1000000
max_tokens = 384000

[models."deepseek-v4-pro".targets.platform]
protocol = "responses"
continuation = "stateless_replay"

[models."deepseek-v4-pro".thinking_level_map]
high = "high"
xhigh = "max"
minimal = ""
low = ""
medium = ""

# Official peak/off-peak schedule (2026-08-16). Peak hours are Beijing time
# 09:00-12:00 and 14:00-18:00; the default schedule is off-peak.
[[models."deepseek-v4-pro".pricing]]
surface = "platform"
basis = "list_price"
currency = "CNY"
policy = "time_of_day"

[models."deepseek-v4-pro".pricing.configuration]
utc_offset = "+08:00"

[models."deepseek-v4-pro".pricing.configuration.default]
input_per_million = 4.5
cached_input_per_million = 0.15
output_per_million = 13.5

[[models."deepseek-v4-pro".pricing.configuration.windows]]
start = "09:00"
end = "12:00"
days = [1, 2, 3, 4, 5]

[models."deepseek-v4-pro".pricing.configuration.windows.rates]
input_per_million = 9.0
cached_input_per_million = 0.30
output_per_million = 27.0

[[models."deepseek-v4-pro".pricing.configuration.windows]]
start = "14:00"
end = "18:00"
days = [1, 2, 3, 4, 5]

[models."deepseek-v4-pro".pricing.configuration.windows.rates]
input_per_million = 9.0
cached_input_per_million = 0.30
output_per_million = 27.0

