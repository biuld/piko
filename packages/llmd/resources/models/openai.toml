# OpenAI model catalog
# thinking_level_map: empty string "" = explicitly unsupported (null in pi)

[provider]
id = "openai"

[upstream_tools.search]
name = "web_search"
approval = "never"
definition = { type = "web_search" }
choice = { type = "web_search" }
activity_types = ["web_search_call"]

[api_surfaces.platform]
base_url = "https://api.openai.com/v1"
auth_methods = ["api_key"]
upstream_tools = ["search"]

[api_surfaces.subscription]
base_url = "https://chatgpt.com/backend-api/codex/"
auth_methods = ["oauth"]
upstream_tools = []

[default_targets.platform]
protocol = "responses"

[default_targets.subscription]
protocol = "responses"
continuation = "encrypted_reasoning"

# ---- GPT-5.x ----

[models."gpt-5.6"]
name = "GPT-5.6 (Sol alias)"
reasoning = true
input = ["text", "image"]
context_window = 1050000
max_tokens = 128000

[models."gpt-5.6".thinking_level_map]
off = "none"
minimal = ""
max = "max"

[[models."gpt-5.6".pricing]]
surface = "platform"
basis = "list_price"
currency = "USD"
input_per_million = 5.0
cached_input_per_million = 0.5
output_per_million = 30.0
cache_write_per_million = 6.25

[[models."gpt-5.6".pricing.tiers]]
input_tokens_above = 272000
input_multiplier = 2.0
output_multiplier = 1.5

[[models."gpt-5.6".pricing]]
surface = "subscription"
basis = "api_equivalent"
copy_from = "platform"

[models."gpt-5.6".targets.platform]
protocol = "responses"

[models."gpt-5.6".targets.subscription]
