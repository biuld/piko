[package]
name = "piko-hostd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "piko host runtime daemon"

[lib]
name = "piko_hostd"
path = "src/lib.rs"

[[bin]]
name = "piko-hostd"
path = "src/main.rs"

[dependencies]
piko-llmd = { path = "../llmd" }
async-trait = "0.1"
async-stream = "0.3"

piko-orchd = { path = "../orchd" }
piko-orchd-api = { path = "../orchd-api" }
piko-comms = { path = "../comms" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-core = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.31"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = "0.4"
dirs = "6"
piko-protocol = { version = "0.1.0", path = "../protocol" }

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "0.31", features = ["testing", "trace", "metrics", "logs", "rt-tokio"] }
