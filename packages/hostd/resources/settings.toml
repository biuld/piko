# ~/.piko/settings.toml
# Global settings for piko

# Default AI provider (e.g., "anthropic", "openai", "google", "deepseek")
# default-provider = "anthropic"

# Default AI model ID (e.g., "claude-3-5-sonnet", "gpt-4o")
# default-model = "claude-3-5-sonnet"

# Default thinking level for reasoning models ("off", "minimal", "low", "medium", "high", "xhigh", "max")
# default-thinking-level = "medium"

# Stdio framing transport protocol ("stdio")
# transport = "stdio"

# Optional session storage root (defaults to ~/.piko/sessions)
# session-dir = "/path/to/sessions"

# Optional exact tool-name allowlist. Omit for every discovered tool; use an
# empty list to disable all tools. Feature-family gates below are preferred.
# active-tool-names = []

# Presentation preferences (theme, hide-thinking-block, etc.) are NOT host
# fields. They belong to the frontend-owned [tui] table below — see
# `packages/hostd/src/domain/config/settings.rs`. hostd persists these tables
# opaquely and does not validate their contents. Unknown top-level keys are
# ignored.
#
# [tui]
# [tui.theme]
# name = "dark"
# hide_thinking_block = false
#
[compaction]
# Enable automatic history compaction when token count exceeds thresholds
enabled = true
# Number of tokens to reserve for system prompt and current context
reserve-tokens = 16384
# Number of recent tokens to preserve in full detail
keep-recent-tokens = 20000
# Minimum growth before a second automatic compaction. An explicit token
# value wins over the model-relative fraction.
# min-growth-tokens = 16384
# min-growth-fraction = 0.125
# Optional summarizer override; failure falls back to the default model.
# summarizer-model = "fast-model"
# summarizer-provider = "provider"

[transcript]
# Maximum estimated tokens retained from one tool result in model context.
max-tool-output-tokens = 24000

[retry]
# Enable automatic retries on LLM API connection failures
enabled = true
# Maximum number of retry attempts
max-retries = 3
# Base backoff delay in milliseconds
base-delay-ms = 2000
# Maximum delay for one retry and total retry-time budget.
max-delay-ms = 30000
budget-ms = 60000

[approvals]
# How long a pending tool approval waits for a user decision before it
# expires and the tool call fails closed (seconds).
timeout-secs = 120

[guardian]
# When enabled, on-request tool approvals are first reviewed by a bounded
# model call over recent session context. An allow executes the call once
# (no store grant); a deny fails the call closed; timeout or malformed
# output also fails closed. Consecutive non-accepting outcomes trip a
# per-session circuit breaker that escalates to the user.
enabled = false
# Reviewer model/provider; fall back to the session default when unset.
# model = "claude-3-5-sonnet"
# provider = "anthropic"
# Review deadline in seconds before the request fails closed.
timeout-secs = 30
# Consecutive denies + failures that trip the circuit breaker.
max-consecutive-denials = 3

[safety]
# Deterministic write-safety gate for workspace writes (F-12). When true,
# `edit`/`write` requests whose targets are fully inside the sandbox
# writable roots are auto-approved one-shot (no prompt, no store grant);
# targets outside the roots fail closed with `safety_rejected`. When false,
# write approvals use the normal user/guardian flow.
auto-approve-workspace-writes = true

[permissions]
# Permission profiles (F-17): named bundles of file/network policy
# (materialized into the sandbox policy) and command policy (materialized
# into the approval gateway). `profile` selects the active profile; the
# built-in "default" mirrors the restricted workspace defaults and has no
# command rules. Profiles merge across global/project/override settings.
# The built-in default is the same as configuring nothing, so the section is
# purely opt-in:
# profile = "default"

# Example: a project profile that locks down network access and blocks
# destructive commands before they can prompt or run.
# [permissions.profiles.locked]
# read-roots = ["."]
# write-roots = ["."]
# scratch-roots = ["/tmp"]
# deny-paths = [".git", ".piko"]
# allow-network = false
# allow-escalation = false
# allowed-commands = ["cargo test", "git status", "npm test"]
# denied-commands = ["rm -rf", "curl -sSL | sh"]

[permissions.roles]
# Agent-role profile selection (F-19): maps an agent role (from the agent
# spec, e.g. root/generalist/developer/researcher) to a permission profile.
# Tools executed by an agent with a mapped role use that profile's command
# policy and file/network policy; unmapped roles inherit the session
# `profile` above. Roles merge per key across settings layers. A mapping to
# the built-in "default" or to an unknown profile is a no-op (the role
# inherits the session profile) -- role layers can never loosen below the
# session posture.
# Example: researcher subagents are read-only and coder subagents can never
# run destructive commands, while the root agent keeps the session profile.
# researcher = "readonly"
# developer = "locked"

[mcp]
# MCP integration (F-13): each configured MCP server is connected eagerly at
# session start (prewarm) under this per-server timeout. A server that
# exceeds the timeout is skipped with a warning naming it; the others
# connect normally. Per-server `timeout-ms` overrides this value.
# connect-timeout-ms = 10000

[mcp.approval-templates]
# Operator-authored approval prompts for MCP tools, keyed by "server/tool"
# (exact) or bare "tool" (fallback). When an MCP tool needs approval, the
# rendered prompt replaces the generic question in the TUI. Templates
# are presentation text only -- they never change the approval flow.
# Placeholders: {server}, {tool}, {args}.
# "github/create_issue" = "This creates a GitHub issue in the configured repository."

# MCP servers (stdio JSON-RPC 2.0): each entry spawns `command` and
# discovers tools + resources at session start.
# [[mcp-servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# timeout-ms = 5000

[prompt]
# disabled | provider-default | ephemeral | extended
cache-policy = "provider-default"

[features]
# Managed feature gating (F-18): named tool-family features resolved once per
# session start. All features are enabled by default. Disabling a feature
# removes its tools from the model-visible catalog; direct calls to a
# disabled tool fail closed with `feature_disabled`.
# Canonical keys: workspace (read/edit/write), exec (exec_command/write_stdin), environment,
# context (get_context_remaining / new_context_window), todo,
# multi-agent (spawn/followup/interrupt/list/wait), user-interaction
# (ask_user / request_user_input), mcp (MCP-server tools).
# Example: disable command execution and MCP tools project-wide.
# exec = false
# mcp = false

[features.managed]
# Operator pins: final authority over [features] enabled in every layer.
# A conflicting explicit value logs a warning and the pin wins (fail closed).
# Example: pin MCP off so no global/override setting can re-enable it.
# mcp = false

[execution]
# Shell used for command programs. The default resolves from $SHELL and
# platform fallbacks. Restricted execution is always enforced and has no
# disable switch.
# shell = "/bin/zsh"

[observability]
# End-to-end tracing + metrics export over OTLP HTTP (Jaeger/OTel collector).
enabled = false
# Sensitive GenAI bodies (prompts, transcript, tool definitions). This is a
# separate opt-in and remains off even when OTLP export is enabled.
capture-content = false
# OTLP HTTP endpoint; /v1/traces and /v1/metrics are appended automatically
otel-endpoint = "http://127.0.0.1:4318"
# Prefer http://localhost:4318 when system HTTP proxies (e.g. Shadowrocket)
# hijack 127.0.0.1; hostd exporters also disable proxy for OTLP.
# service.name used in the exported resource
# service-name = "piko-hostd"
