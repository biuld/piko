[package]
name = "piko-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS GPUI desktop shell for piko hostd"

[[bin]]
name = "piko-desktop"
path = "src/main.rs"

[dependencies]
piko-comms = { path = "../comms" }
piko-client-core = { path = "../client-core" }
piko-protocol = { path = "../protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Product-independent GPUI infrastructure (ADR-022); sibling checkout.
island = { path = "../../../island-rs/crates/island" }
# Same unpinned gpui source as island so Cargo unifies to one GPUI build.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "b77f352589503a114cdf709507c0738a88e28364" }

[dev-dependencies]
tempfile = "3"
