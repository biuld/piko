[package]
name = "piko-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS GPUI desktop shell for piko hostd"

[[bin]]
name = "piko-desktop"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
piko-comms = { path = "../comms" }
piko-client-core = { path = "../client-core" }
piko-protocol = { path = "../protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Product-independent GPUI infrastructure (ADR-022); sibling checkout.
island = { path = "../../../island-rs/crates/island" }

[dev-dependencies]
tempfile = "3"
