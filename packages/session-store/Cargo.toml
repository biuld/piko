[package]
name = "piko-session-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Append-only event journal and deterministic session projections for piko"

[dependencies]
crc32fast = "1"
piko-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
