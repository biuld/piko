# piko built-in theme: dark
# Optimized for dark terminal backgrounds.
# Accent (#5f87ff) is for selection/highlights only — never panel borders.

[theme]
name = "dark"

[vars]
# Brand / selection accent
accent_blue = "#5f87ff"
cyan = "#00d7ff"
green = "#b5bd68"
red = "#cc6666"
yellow = "#ffff00"
text_color = "#d4d4d4"
gray = "#808080"
dim_gray = "#666666"
dark_gray = "#505050"
selected_bg = "#3a3a4a"
user_msg_bg = "#343541"
tool_pending_bg = "#282832"
tool_success_bg = "#283228"
tool_error_bg = "#3c2828"
custom_msg_bg = "#2d2838"
# Layer-2 palette (referenced below — not used raw in UI code)
purple = "#9575cd"
gold = "#f0c674"
sky = "#81a2be"
syntax_comment = "#6A9955"
syntax_keyword = "#569CD6"
syntax_function = "#DCDCAA"
syntax_variable = "#9CDCFE"
syntax_string = "#CE9178"
syntax_number = "#B5CEA8"
syntax_type = "#4EC9B0"
thinking_minimal = "#6e6e6e"
thinking_low = "#5f87af"
thinking_medium = "#81a2be"
thinking_high = "#b294bb"
thinking_xhigh = "#d183e8"

[colors]
# Layer 1 — accent is selection / marks; borders are neutral chrome only
accent = "accent_blue"
accentAlt = "cyan"
border = "gray"
borderMuted = "dark_gray"
success = "green"
error = "red"
warning = "yellow"
info = "accent_blue"
muted = "gray"
dim = "dim_gray"
text = "text_color"

# Layer 2 / 3
thinkingText = "gray"
selectedBg = "selected_bg"
userMessageBg = "user_msg_bg"
userMessageText = "text_color"
customMessageBg = "custom_msg_bg"
customMessageText = "text_color"
customMessageLabel = "purple"
toolPendingBg = "tool_pending_bg"
toolSuccessBg = "tool_success_bg"
toolErrorBg = "tool_error_bg"
toolTitle = "text_color"
toolOutput = "gray"
mdHeading = "gold"
mdLink = "sky"
mdLinkUrl = "dim_gray"
mdCode = "accent_blue"
mdCodeBlock = "green"
mdCodeBlockBorder = "gray"
mdQuote = "gray"
mdQuoteBorder = "gray"
mdHr = "gray"
mdListBullet = "accent_blue"
toolDiffAdded = "green"
toolDiffRemoved = "red"
toolDiffContext = "gray"
syntaxComment = "syntax_comment"
syntaxKeyword = "syntax_keyword"
syntaxFunction = "syntax_function"
syntaxVariable = "syntax_variable"
syntaxString = "syntax_string"
syntaxNumber = "syntax_number"
syntaxType = "syntax_type"
syntaxOperator = "text_color"
syntaxPunctuation = "text_color"
thinkingOff = "dark_gray"
thinkingMinimal = "thinking_minimal"
thinkingLow = "thinking_low"
thinkingMedium = "thinking_medium"
thinkingHigh = "thinking_high"
thinkingXhigh = "thinking_xhigh"
bashMode = "green"
