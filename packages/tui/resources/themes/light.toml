# piko built-in theme: light
# Optimized for light terminal backgrounds.
# Accent is for selection/highlights only — never panel borders.

[theme]
name = "light"

[vars]
accent_blue = "#547da7"
green = "#588458"
red = "#aa5555"
yellow = "#9a7326"
text_color = "#1f2328"
medium_gray = "#6c6c6c"
dim_gray = "#767676"
light_gray = "#b0b0b0"
selected_bg = "#d0d0e0"
user_msg_bg = "#e8e8e8"
tool_pending_bg = "#e8e8f0"
tool_success_bg = "#e8f0e8"
tool_error_bg = "#f0e8e8"
custom_msg_bg = "#ede7f6"
purple = "#7e57c2"
cyan_alt = "#5a8080"
syntax_comment = "#008000"
syntax_keyword = "#0000FF"
syntax_function = "#795E26"
syntax_variable = "#001080"
syntax_string = "#A31515"
syntax_number = "#098658"
syntax_type = "#267F99"
thinking_high = "#875f87"
thinking_xhigh = "#8b008b"

[colors]
accent = "accent_blue"
accentAlt = "cyan_alt"
border = "medium_gray"
borderMuted = "light_gray"
success = "green"
error = "red"
warning = "yellow"
info = "accent_blue"
muted = "medium_gray"
dim = "dim_gray"
text = "text_color"

thinkingText = "medium_gray"
selectedBg = "selected_bg"
userMessageBg = "user_msg_bg"
userMessageText = "text_color"
customMessageBg = "custom_msg_bg"
customMessageText = "text_color"
customMessageLabel = "purple"
toolPendingBg = "tool_pending_bg"
toolSuccessBg = "tool_success_bg"
toolErrorBg = "tool_error_bg"
toolTitle = "text_color"
toolOutput = "medium_gray"
mdHeading = "yellow"
mdLink = "accent_blue"
mdLinkUrl = "dim_gray"
mdCode = "accent_blue"
mdCodeBlock = "green"
mdCodeBlockBorder = "medium_gray"
mdQuote = "medium_gray"
mdQuoteBorder = "medium_gray"
mdHr = "medium_gray"
mdListBullet = "green"
toolDiffAdded = "green"
toolDiffRemoved = "red"
toolDiffContext = "medium_gray"
syntaxComment = "syntax_comment"
syntaxKeyword = "syntax_keyword"
syntaxFunction = "syntax_function"
syntaxVariable = "syntax_variable"
syntaxString = "syntax_string"
syntaxNumber = "syntax_number"
syntaxType = "syntax_type"
syntaxOperator = "text_color"
syntaxPunctuation = "text_color"
thinkingOff = "light_gray"
thinkingMinimal = "dim_gray"
thinkingLow = "accent_blue"
thinkingMedium = "accent_blue"
thinkingHigh = "thinking_high"
thinkingXhigh = "thinking_xhigh"
bashMode = "green"
