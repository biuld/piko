# piko built-in theme: light
# Same 96-slot catalog as dark (GrokDay-inspired grays + deepened accents).
# Accent is for selection / marks only — never panel borders.

[theme]
name = "light"

[vars]
bg_terminal_v = "#f5f5f5"
bg_base_v = "#eeeeee"
bg_elevated_v = "#e4e4e4"
bg_sunken_v = "#e4e4e4"
bg_highlight_v = "#dedede"
bg_hover_v = "#d0d0d0"
bg_selected_v = "#d0d0e0"
bg_visual_v = "#c6c6c6"

text_v = "#262626"
text_secondary_v = "#444444"
dim_v = "#a5a5a5"
muted_v = "#767676"
gray_bright_v = "#626262"

blue = "#2f64d2"
cyan = "#0082aa"
green = "#378e23"
red = "#cd3048"
yellow = "#a27612"
orange = "#c3691e"
magenta = "#7d4bc6"
purple = "#6c3eb2"
teal = "#0a8e70"
blue1 = "#0f87a2"
gold = "#a8780a"
accent_blue = "#547da7"

red_light = "#f5dade"
green_light = "#daf2dc"
user_msg_bg = "#e8e8e8"
tool_pending_bg = "#e8e8f0"
tool_success_bg = "#e8f0e8"
